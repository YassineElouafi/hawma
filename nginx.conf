server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/html text/plain;
  add_header X-Content-Type-Options nosniff;
  location / { try_files $uri $uri.html $uri/ /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
}
