name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: hawma, POSTGRES_DB: hawma }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:hawma@localhost:5432/hawma
      REDIS_URL: redis://localhost:6379
      OTP_IP_LIMIT: "1000"
      RATE_LIMIT_MAX: "100000"
      RATE_LIMIT_UNAUTH_MAX: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx src/db/migrate.ts
      - run: npm test
      - name: Production-mode smoke (Postgres stores, staff bootstrap, ops login)
        env: { HAWMA_STORE: postgres, PORT: "3999", STAFF_PASSWORD: "smoke-test-password-123" }
        run: |
          npx tsx src/db/staff-create.ts smoke@hawma.ma admin
          npx tsx src/main.ts > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3999/healthz && break; sleep 1; done
          curl -sf localhost:3999/healthz
          TOKEN=$(curl -sf -X POST localhost:3999/ops/login -H 'content-type: application/json' -d '{"email":"smoke@hawma.ma","password":"smoke-test-password-123"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf localhost:3999/ops/me -H "authorization: Bearer $TOKEN" | grep -q smoke@hawma.ma
          curl -sf "localhost:3999/v1/search?lat=33.58&lng=-7.63" | grep -q '\['
          cat api.log
      - name: Build API image
        working-directory: apps/api
        run: docker build -t hawma-api .
